[build]
ignore = "node ./scripts/ignore-unpublished-build.mjs"
functions = "netlify/functions"
command = "npx vite build"
publish = "dist"

[functions]
node_bundler = "esbuild"

# Prerendered routes are real files (dist/<route>/index.html).
# These rewrites keep direct visits working even if pretty URLs are off.
# There is intentionally no "/* -> /index.html 200" rule: that rewrite made
# unknown URLs, robots.txt, sitemap.xml, and favicon.ico return the SPA shell
# with status 200. Missing files now fall through to dist/404.html (status 404).

[[redirects]]
  from = "/gallery"
  to = "/gallery/index.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/events/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/art-cards"
  to = "/art-cards/index.html"
  status = 200

[[redirects]]
  from = "/ar-experience"
  to = "/ar-experience/index.html"
  status = 200

[[redirects]]
  from = "/ar-camera"
  to = "/ar-camera/index.html"
  status = 200


[[redirects]]
  from = "/hiddenpage"
  to = "/hiddenpage/index.html"
  status = 200

[[redirects]]
  from = "/hiddenpage/camera"
  to = "/hiddenpage/camera/index.html"
  status = 200

[[redirects]]
  from = "/hiddenpage/media/moonlit-mandala.mp4"
  to = "/images/ar-mandala-2g.mp4"
  status = 200

[[redirects]]
  from = "/hiddenpage/media/mountain-mandala.mp4"
  to = "/images/ar-mandala-3b.mp4"
  status = 200

[[redirects]]
  from = "/buy-your-own"
  to = "/buy-your-own/index.html"
  status = 200
